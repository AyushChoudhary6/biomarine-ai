<!DOCTYPE html>
<html>
<head>
  <title>Loading Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <style>
        /* styles.css */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            color: white; /* Make sure your text is visible */
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1; /* This sends the video to the background */
        }

        .video-container video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1; /* This brings your content to the foreground */
            height: 100vh;
            text-align: center;
            color: black;
        }

        .button{
            background-color: whitesmoke; 
            border: none;
            color: black;
            padding: 20px 5em;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 10px 10px 5px rgb(74, 74, 74);
        }

        .button a{
            text-decoration: none;
            color: black;
        }
        .button:hover{
            background-color: rgb(221, 221, 221);
            box-shadow: 5px 5px 5px rgb(74, 74, 74);
            transform: translateY(2px);
        }
    </style>

    <div class="video-container">
        <video autoplay muted playsinline loop >
            <source src="/src/stock/loadingVid.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>


  <main>
    <div class="delayed" style="display:none;">
        <h1 style="font-size: 3.3em;">BioMarine AI</h1>
        <h3 style="font-size: 1.5em;">Enabling ai- driven recognition for ocenographic</h3>
        <div class="button">
            <a href="index.html">Enter</a>
        </div>
        
    </div>
  </main>
  

    

    
  <script>
        // Get a reference to the button element
        const button = document.querySelector('.delayed');

        // Use setTimeout to run a function after a 5-second delay
        setTimeout(function() {
            // Change the button's display style from 'none' to 'block'
            button.style.display = 'block';
        }, 7500); // 5000 milliseconds = 5 seconds


        
    </script>
</body>
</html>
